openapi: 3.0.3
info:
  title: Order Management API
  version: 1.0.0
  description: Shared API contract for provider and QA automation.
servers:
  - url: http://127.0.0.1:4010
paths:
  /orders/{orderId}:
    get:
      operationId: getOrder
      summary: Retrieve an order
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Order found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
              example:
                orderId: 123
                customerId: 456
                status: SHIPPED
                totalAmount: 149.99
                currency: USD
                items:
                  - productId: P100
                    quantity: 2
                    unitPrice: 74.995
        '400':
          description: Invalid order ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: INVALID_ORDER_ID
                message: Order ID must be a positive integer
        '404':
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: ORDER_NOT_FOUND
                message: Order not found
components:
  schemas:
    Order:
      type: object
      required: [orderId, customerId, status, totalAmount, currency, items]
      properties:
        orderId:
          type: integer
          minimum: 1
        customerId:
          type: integer
          minimum: 1
        status:
          type: string
          enum: [CREATED, PAID, SHIPPED, DELIVERED, CANCELLED]
        totalAmount:
          type: number
          minimum: 0
        currency:
          type: string
          enum: [USD, EUR]
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [productId, quantity, unitPrice]
            properties:
              productId:
                type: string
                minLength: 1
              quantity:
                type: integer
                minimum: 1
              unitPrice:
                type: number
                minimum: 0
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
